<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Stone Pool Basin -->
  <circle cx="50" cy="50" r="44" fill="#4a5568" stroke="#2d3748" stroke-width="3"/>
  <!-- Water in Outer Basin -->
  <circle cx="50" cy="50" r="38" fill="#319795"/>
  <!-- Inner Basin Tier -->
  <circle cx="50" cy="50" r="24" fill="#718096" stroke="#4a5568" stroke-width="2"/>
  <circle cx="50" cy="50" r="19" fill="#4fd1c5"/>
  <!-- Center Spout -->
  <circle cx="50" cy="50" r="9" fill="#e2e8f0" stroke="#a0aec0" stroke-width="2"/>
  <!-- Water Droplets / Ripples -->
  <ellipse cx="50" cy="50" rx="30" ry="30" fill="none" stroke="#e6fffa" stroke-width="1.5" stroke-dasharray="6 6"/>
  <circle cx="50" cy="50" r="4" fill="#ffffff"/>
</svg>