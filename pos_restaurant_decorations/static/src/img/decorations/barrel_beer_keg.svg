<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Stainless Steel Keg -->
  <rect x="25" y="20" width="50" height="64" rx="10" fill="#a0aec0" stroke="#4a5568" stroke-width="2.5"/>
  <!-- Top Rim Handle Openings -->
  <ellipse cx="50" cy="20" rx="25" ry="7" fill="#cbd5e0" stroke="#4a5568" stroke-width="2"/>
  <rect x="36" y="24" width="28" height="5" rx="2" fill="#718096"/>
  <!-- Stainless Ribs / Ridges -->
  <ellipse cx="50" cy="42" rx="25" ry="5" fill="none" stroke="#4a5568" stroke-width="3"/>
  <ellipse cx="50" cy="62" rx="25" ry="5" fill="none" stroke="#4a5568" stroke-width="3"/>
  <ellipse cx="50" cy="84" rx="25" ry="7" fill="#718096" stroke="#4a5568" stroke-width="2"/>
  <!-- Center Tap Valve -->
  <circle cx="50" cy="20" r="4" fill="#d4af37"/>
</svg>